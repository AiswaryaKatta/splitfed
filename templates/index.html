<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SplitFed Learning Dashboard</title>
</head>
<body>
    <h1>SplitFed Learning</h1>
    <form action="/train" method="post">
        <label>Number of Clients:</label>
        <input type="number" name="clients" value="2"><br><br>

        <label>Global Rounds:</label>
        <input type="number" name="rounds" value="5"><br><br>

        <label>Local Epochs per Client:</label>
        <input type="number" name="local_epochs" value="3"><br><br>

        <label>Training Mode:</label>
        <select name="mode">
            <option value="SFLV1">SFLV1</option>
            <option value="SFLV2">SFLV2</option>
        </select><br><br>

        <label>Quick Mode:</label>
        <input type="checkbox" name="quick_mode" value="yes" checked><br><br>

        <input type="submit" value="Start Training">
    </form>

    {% if show_graph %}
        <h2>Accuracy Trend</h2>
        <img src="{{ url_for('static', filename=graph_file) }}" alt="Accuracy Graph" width="600">
    {% endif %}
</body>
</html>
